<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R J SNACKS - Menu & Cart</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 20px; padding-bottom: 100px; }
        header { text-align: center; margin-bottom: 30px; position: relative; }
        header h1 { color: #ff9800; font-size: 2.2rem; margin-bottom: 5px; }
        header p { color: #aaa; font-size: 1rem; }
        
        .category { margin-bottom: 25px; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .category h2 { color: #fff; border-bottom: 2px solid #ff9800; padding-bottom: 5px; margin-bottom: 15px; font-size: 1.4rem; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .menu-card { background: #1e1e1e; border-radius: 10px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; }
        .item-info h3 { font-size: 1.2rem; color: #fff; margin-bottom: 5px; }
        .item-info p { color: #aaa; font-size: 0.9rem; margin-bottom: 15px; }
        .item-footer { display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 1.1rem; color: #4caf50; font-weight: bold; }
        
        .add-btn { background: #ff9800; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .add-btn:hover { background: #e68900; }

        /* Floating Cart Bar (Zomato/Swiggy Style) */
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #1f1f1f; border-top: 2px solid #ff9800; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); z-index: 1000; }
        .cart-info { font-size: 1.1rem; color: #fff; font-weight: bold; }
        .checkout-btn { background: #25d366; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .checkout-btn:hover { background: #20ba5a; }

        footer { text-align: center; margin-top: 40px; color: #777; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <h1>R J SNACKS</h1>
        <p>Fresh & Crispy Veg-NonVeg Fast Food</p>
    </header>

    <div class="category">
        <h2>🔥 Special Non-Veg Menu</h2>
        <div class="menu-grid" id="menu-container">
            <!-- Items rendered via JavaScript -->
        </div>
    </div>

    <!-- Floating Cart Bar -->
    <div class="cart-bar" id="cartBar" style="display: none;">
        <div class="cart-info" id="cartSummary">0 Items | ₹0</div>
        <button class="checkout-btn" onclick="checkoutWhatsApp()">🛒 Order on WhatsApp</button>
    </div>

    <footer>
        <p>&copy; 2026 R J SNACKS. All Rights Reserved.</p>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Chicken Popcorn", price: 149, desc: "Crispy, bite-sized golden fried chicken chunks loaded with spices." },
            { id: 2, name: "Chicken Cheese Pockets", price: 179, desc: "Crispy pockets stuffed with juicy chicken and melting cheese." },
            { id: 3, name: "Pizza Pockets", price: 129, desc: "Delicious crispy pockets packed with pizza sauce, veggies, and cheese." },
            { id: 4, name: "Chicken Nuggets", price: 139, desc: "Classic tender chicken nuggets fried to golden perfection." },
            { id: 5, name: "Prawns Bites", price: 199, desc: "Crunchy, flavorful seafood bites seasoned with special spices." }
        ];

        let cart = {};

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            products.forEach(item => {
                container.innerHTML += `
                    <div class="menu-card">
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <p>${item.desc}</p>
                        </div>
                        <div class="item-footer">
                            <span class="price">₹${item.price}</span>
                            <button class="add-btn" onclick="addToCart(${item.id})">Add to Cart</button>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            if (!cart[id]) {
                cart[id] = { ...products.find(p => p.id === id), qty: 1 };
            } else {
                cart[id].qty += 1;
            }
            updateCartBar();
        }

        function updateCartBar() {
            let totalItems = 0;
            let totalPrice = 0;
            for (let id in cart) {
                totalItems += cart[id].qty;
                totalPrice += cart[id].price * cart[id].qty;
            }

            const cartBar = document.getElementById('cartBar');
            const cartSummary = document.getElementById('cartSummary');

            if (totalItems > 0) {
                cartBar.style.display = 'flex';
                cartSummary.innerText = `${totalItems} Items added | Total: ₹${totalPrice}`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function checkoutWhatsApp() {
            let message = "Hi, I want to place an order from R J SNACKS:\n\n";
            let totalPrice = 0;
            
            for (let id in cart) {
                let item = cart[id];
                let itemTotal = item.price * item.qty;
                message += `▪️ ${item.name} x ${item.qty} = ₹${itemTotal}\n`;
                totalPrice += itemTotal;
            }

            message += `\n*Total Amount: ₹${totalPrice}*\nPlease confirm my order!`;

            let encodedMessage = encodeURIComponent(message);
            let whatsappUrl = `https://wa.me/919224162350?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }

        renderMenu();
    </script>
</body>
</html>
